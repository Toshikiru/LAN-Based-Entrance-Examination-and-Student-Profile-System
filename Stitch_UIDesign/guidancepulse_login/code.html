<style>
        @keyframes gradient-border {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animated-gradient-border {
            background: linear-gradient(90deg, #004ac6, #6cf8bb, #004ac6);
            background-size: 200% 200%;
            animation: gradient-border 4s linear infinite;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .floating-label-input:focus-within label,
        .floating-label-input input:not(:placeholder-shown) + label {
            transform: translateY(-24px) scale(0.85);
            color: #004ac6;
            font-weight: 600;
        }

        @keyframes pulse-subtle {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 74, 198, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(0, 74, 198, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 74, 198, 0); }
        }

        .pulse-btn {
            animation: pulse-subtle 3s infinite;

<!-- School ID Field -->
<div class="relative floating-label-input">
<input class="w-full h-14 px-md pt-base bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none" id="schoolId" placeholder=" " type="text"/>
<label class="absolute left-md top-4 text-on-surface-variant pointer-events-none transition-all duration-200" for="schoolId">School ID</label>

<script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('passIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.innerText = 'visibility';
            }
        }

        // Atmospheric mouse glow effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            // You can add an optional mouse-following radial gradient here for extra flair
        });
    </script>
