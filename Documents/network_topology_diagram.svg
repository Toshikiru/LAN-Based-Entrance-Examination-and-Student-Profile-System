<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- Outer boundary: institution LAN -->
  <rect x="30" y="60" width="840" height="470" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="450" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Institution Local Area Network (Guidance Office)</text>

  <!-- Crossed-out internet cloud, outside the LAN boundary -->
  <g>
    <ellipse cx="450" cy="580" rx="90" ry="30" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
    <text x="450" y="585" text-anchor="middle" font-size="13" fill="#555555">External Internet</text>
    <line x1="390" y1="560" x2="510" y2="600" stroke="#c0392b" stroke-width="2.5"/>
    <line x1="510" y1="560" x2="390" y2="600" stroke="#c0392b" stroke-width="2.5"/>
    <text x="450" y="612" text-anchor="middle" font-size="11" fill="#c0392b">not required for system operation</text>
  </g>
  <line x1="450" y1="530" x2="450" y2="548" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Server box -->
  <rect x="360" y="95" width="180" height="90" rx="6" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="2"/>
  <text x="450" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#12395e">Application + Database Server</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#12395e">XAMPP: Apache + PHP + MariaDB</text>
  <text x="450" y="158" text-anchor="middle" font-size="12" fill="#12395e">(Laravel application)</text>
  <text x="450" y="176" text-anchor="middle" font-size="12" font-style="italic" fill="#3f6ea5">Static IP: 192.168.1.10 (example)</text>

  <!-- Line: server to switch -->
  <line x1="450" y1="185" x2="450" y2="240" stroke="#333333" stroke-width="2"/>

  <!-- Switch/Router box -->
  <rect x="370" y="240" width="160" height="70" rx="6" fill="#fdf3e3" stroke="#b8860b" stroke-width="2"/>
  <text x="450" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c00">Network Switch / Router</text>
  <text x="450" y="286" text-anchor="middle" font-size="12" font-style="italic" fill="#8a6d1a">LAN gateway: 192.168.1.1 (example)</text>
  <text x="450" y="301" text-anchor="middle" font-size="11" fill="#8a6d1a">Subnet: 255.255.255.0 (/24)</text>

  <!-- Lines: switch to 4 client stations -->
  <line x1="450" y1="310" x2="130" y2="400" stroke="#333333" stroke-width="1.5"/>
  <line x1="450" y1="310" x2="330" y2="400" stroke="#333333" stroke-width="1.5"/>
  <line x1="450" y1="310" x2="570" y2="400" stroke="#333333" stroke-width="1.5"/>
  <line x1="450" y1="310" x2="770" y2="400" stroke="#333333" stroke-width="1.5"/>

  <!-- Client stations -->
  <g>
    <rect x="60" y="400" width="140" height="80" rx="6" fill="#eefaf0" stroke="#2f7d3c" stroke-width="2"/>
    <text x="130" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5c29">Client PC 1</text>
    <text x="130" y="446" text-anchor="middle" font-size="11" fill="#1f5c29">Guidance Counselor</text>
    <text x="130" y="463" text-anchor="middle" font-size="11" font-style="italic" fill="#3f8a4c">DHCP-assigned</text>
  </g>
  <g>
    <rect x="260" y="400" width="140" height="80" rx="6" fill="#eefaf0" stroke="#2f7d3c" stroke-width="2"/>
    <text x="330" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5c29">Client PC 2</text>
    <text x="330" y="446" text-anchor="middle" font-size="11" fill="#1f5c29">Super Administrator</text>
    <text x="330" y="463" text-anchor="middle" font-size="11" font-style="italic" fill="#3f8a4c">DHCP-assigned</text>
  </g>
  <g>
    <rect x="500" y="400" width="140" height="80" rx="6" fill="#eefaf0" stroke="#2f7d3c" stroke-width="2"/>
    <text x="570" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5c29">Client PC 3..N</text>
    <text x="570" y="446" text-anchor="middle" font-size="11" fill="#1f5c29">Student Testing Station</text>
    <text x="570" y="463" text-anchor="middle" font-size="11" font-style="italic" fill="#3f8a4c">DHCP-assigned</text>
  </g>
  <g>
    <rect x="700" y="400" width="140" height="80" rx="6" fill="#eefaf0" stroke="#2f7d3c" stroke-width="2"/>
    <text x="770" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5c29">Client PC N+1</text>
    <text x="770" y="446" text-anchor="middle" font-size="11" fill="#1f5c29">Student Testing Station</text>
    <text x="770" y="463" text-anchor="middle" font-size="11" font-style="italic" fill="#3f8a4c">DHCP-assigned</text>
  </g>

  <!-- Legend / note box -->
  <rect x="60" y="500" width="780" height="55" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <text x="450" y="520" text-anchor="middle" font-size="11.5" fill="#444444">All IP addresses shown are illustrative examples for a typical /24 private LAN and must be replaced</text>
  <text x="450" y="537" text-anchor="middle" font-size="11.5" fill="#444444">with the actual static server IP, gateway, and DHCP range confirmed at the Guidance Office deployment site.</text>
</svg>
